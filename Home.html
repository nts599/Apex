<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apex — Home</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

  <div id="preloader">
      <video id="preloader-video" autoplay muted playsinline preload="auto">
        <source src="videos/apex_loading_3s.mp4" type="video/mp4">
      </video>
    </div>

  <div class="phone">
    <div class="header">
      <a class="header-left" href="Settings&profile.html" style="text-decoration:none;">
        <img class="avatar" src="pics/avatar.png" alt="Profile">
        <span class="app-name">APEX</span>
      </a>
      <a class="icon-btn" href="Settings&profile.html" aria-label="Settings">
        <img src="pics/setting.png" alt="Settings">
      </a>
    </div>

    <div class="screens">
      <section class="screen center">
        <div class="app-icon">
          <img src="pics/Apex logo.PNG" alt="Apex">
        </div>

        <h1>Welcome to Apex - Become Your <span class="highlight">Highest Self</span></h1>
        <p class="subtitle">Unlock peak performance with precision-guided focus sessions.</p>

        <a class="btn btn-primary" href="Session.html" style="text-decoration:none;">
          <span class="btn-left">
            <img src="pics/play.png" alt="">
          Start Study Session
          </span> 
        </a>

        <div class="stats">
          <div class="stat-card">
            <img src="pics/lightning.png" alt="">
            <div class="stat-label">STREAK</div>
            <div class="stat-value">12 Days</div>
          </div>
          <div class="stat-card">
            <img src="pics/clock.png" alt="">
            <div class="stat-label">FOCUS TIME</div>
            <div class="stat-value">42.5h</div>
          </div>
        </div>

        <p class="quote">"Precision is the soul of excellence. Excellence is the art of mastery."</p>
      </section>
    </div>

    <div class="nav">
      <a class="nav-item active" href="Home.html">
        <img src="pics/home icon.png" alt="">
        HOME
      </a>
      <a class="nav-item" href="Blocker.html">
        <img src="pics/switch.png" alt="">
        BLOCKER
      </a>
      <a class="nav-item" href="Session.html">
        <img src="pics/session.png" alt="">
        SESSIONS
      </a>
      <a class="nav-item" href="Reports.html">
        <img src="pics/report.png" alt="">
        REPORTS
      </a>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
